<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Radio Chemin - Programm 24h</title>
    <style>
        body { background: transparent; font-family: -apple-system, sans-serif; color: #1A3C2F; margin: 0; padding: 0; }
        #lista { display: flex; flex-direction: column; width: 100%; -webkit-overflow-scrolling: touch; }
        
        .header-status {
            padding: 15px; background: rgba(176, 141, 62, 0.1);
            color: #b08d3e; font-size: 11px; text-align: center;
            text-transform: uppercase; letter-spacing: 2px; border-bottom: 1px solid #b08d3e;
        }

        .item { 
            padding: 16px 20px; border-bottom: 1px solid rgba(176, 141, 62, 0.1); 
            cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: space-between;
            contain: content;
        }

        .item.active { 
            background-color: rgba(176, 141, 62, 0.12); font-weight: 700;
            border-left: 6px solid #b08d3e; color: #036306;
        }

        .item span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .item::after { content: "▶"; font-size: 10px; opacity: 0.3; }
        .item.active::after { content: "ON AIR"; font-size: 9px; opacity: 1; color: #b08d3e; font-weight: bold; }
    </style>
</head>
<body> 
    <div class="header-status" id="relogio-radio">Sintonisatort...</div>
    <div id="lista"></div>

    <script>
        // --- SUA LISTA DE 265 MÚSICAS ---
        // Organize as músicas pensando no ciclo: 0-60 (Madrugada), 60-120 (Manhã), etc.
        const tracks = [
            { u: "https://archive.org/download/1-pablo-casals-col-a-5722-kol-nidrei-1915/1%20Pablo%20Casals%20-%20Col%20A%205722%20Kol%20Nidrei%201915.mp3", n: "001. Pablo Casals: Kol Nidrei Bruch", a: "Pablo Casals", c: "v-chemim-26.png" },
            { u: "https://archive.org/download/1-pablo-casals-col-a-5722-kol-nidrei-1915/2%20Pablo%20Casals%20-%20Col%207359%2048699%201916.mp3", n: "002. Pablo Casals: Cello concerto in a Cantilena Goltermann", a: "Pablo Casals", c: "v-chemim-25.png" },
            { u: "https://archive.org/download/1-pablo-casals-col-a-5722-kol-nidrei-1915/3%20Pablo%20Casals%20-%20Col%207359%2048710%201916.mp3", n: "003. Pablo Casals: Sonata in A Allegro Boccherini", a: "Pablo Casals", c: "v-chemim-24.png" },
            { u: "https://archive.org/download/1-pablo-casals-col-a-5722-kol-nidrei-1915/4%20Pablo%20Casals%20-%20Col%207360%2048716%201916.mp3", n: "004. Pablo Casals: Tannhäuser O star of eve Wagner", a: "Pablo Casals", c: "v-chemim-23.png" },
            { u: "https://archive.org/download/1-pablo-casals-col-a-5722-kol-nidrei-1915/5%20Pablo%20Casals%20-%20Col%207360%2049801%201920.mp3", n: "005. Pablo Casals: Evening song Schumann", a: "Pablo Casals", c: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhrssMkr0KPOdURCbDEyf_07nQNOMzaD7ouIH-d37KNrEbh5FT9uwwlDQ-iXpoBtRTHO29V5fxQNDE1mKfpzORJZZ7mDex3i60Lvbao_FKHOLUitTACM3QTgCuTTfYHe0z4G_ud5yNmv1u5l2ztrZ84Pgkgv_MVlZTKYpfoMnLRl5ZMoelwokM3tAmWTb4/s176/v-chemim-22.png" },
            { u: "https://archive.org/download/dx-1509-11-beethoven-sonata-in-e-op-109/DX1509-11%20Beethoven%20Sonata%20in%20E%20op109.mp3", n: "006. Beethoven: Sonata In E Op 109 Denis Matthews 1946", a: "Beethoven", c: "v-chemim-25.png" },
            { u: "https://archive.org/download/BeethovenViolinConcerto-Milstein/01.I.AllegroMaNonTroppo.mp3", n: "007. Beethoven: Allegro ma non troppo", a: "Beethoven", c: "v-chemim-25.png" },
            { u: "link2.mp3", n: "008. Silent Woods", a: "Dvorak", c: "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhrssMkr0KPOdURCbDEyf_07nQNOMzaD7ouIH-d37KNrEbh5FT9uwwlDQ-iXpoBtRTHO29V5fxQNDE1mKfpzORJZZ7mDex3i60Lvbao_FKHOLUitTACM3QTgCuTTfYHe0z4G_ud5yNmv1u5l2ztrZ84Pgkgv_MVlZTKYpfoMnLRl5ZMoelwokM3tAmWTb4/s176/v-chemim-22.png" },
            { u: "link2.mp3", n: "032. Silent Woods", a: "Dvorak", c: "v-chemim-23.png" },
            { u: "link2.mp3", n: "032. Silent Woods", a: "Dvorak", c: "v-chemim-22.png" },
            // ... Colar até a 265
        ];

        // LÓGICA DE SINCRONIA 24H
        function obterIndicePeloHorario() {
            const agora = new Date();
            const totalMinutosDia = (agora.getHours() * 60) + agora.getMinutes();
            const totalMusicas = tracks.length;
            
            // Cada música ocupa um "bloco" de tempo igual no dia
            // 1440 min / 265 músicas = ~5.43 min por música
            let indice = Math.floor((totalMinutosDia / 1440) * totalMusicas);
            
            return Math.min(indice, totalMusicas - 1);
        }

        let indiceAtual = obterIndicePeloHorario();
        const listaDiv = document.getElementById('lista');

        function renderizarLista(autoScroll = false) {
            const fragment = document.createDocumentFragment();
            listaDiv.innerHTML = '';
            
            tracks.forEach((track, i) => {
                const div = document.createElement('div');
                div.className = i === indiceAtual ? 'item active' : 'item';
                div.onclick = () => selecionar(i);
                div.innerHTML = `<span>${track.n}</span>`;
                fragment.appendChild(div);
            });
            listaDiv.appendChild(fragment);

            if(autoScroll) {
                setTimeout(() => {
                    const active = document.querySelector('.item.active');
                    if(active) active.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }, 600);
            }
        }

        function selecionar(index) {
            indiceAtual = index;
            renderizarLista();
            enviarParaOApp();
        }

        function enviarParaOApp() {
            const m = tracks[indiceAtual];
            if (window.parent) {
                window.parent.postMessage({
                    tipo: 'tocar',
                    url: m.u,
                    nome: m.n,
                    artista: m.a || "Radio Chemin",
                    capa: m.c || "logo.png"
                }, '*');
            }
        }

        // COMANDOS DO PLAYER (NEXT/PREV)
        window.addEventListener('message', (e) => {
            if (e.data === 'next') selecionar((indiceAtual + 1) % tracks.length);
            if (e.data === 'prev') selecionar((indiceAtual - 1 + tracks.length) % tracks.length);
        });

        // Atualiza o relógio da rádio no topo
        function atualizarRelogio() {
            const agora = new Date();
            const h = String(agora.getHours()).padStart(2, '0');
            const m = String(agora.getMinutes()).padStart(2, '0');
            document.getElementById('relogio-radio').innerText = `Live aus Luxemburg — ${h}:${m}`;
        }

        // Início
        setInterval(atualizarRelogio, 1000);
        atualizarRelogio();
        renderizarLista(true); // Faz o scroll para a música do horário ao abrir
        enviarParaOApp();
    </script>
</body>
</html>
